server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /api/v1/broadcast/live-audio {
        proxy_pass http://api:8000/api/v1/broadcast/live-audio;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /docs {
        proxy_pass http://api:8000/docs;
    }

    location = /openapi.json {
        proxy_pass http://api:8000/openapi.json;
    }

    location = /manifest.webmanifest {
        alias /usr/share/nginx/html/manifest.webmanifest;
        default_type application/manifest+json;
    }

    location = /camera-playback-auth {
        internal;
        proxy_pass http://api:8000/api/v1/broadcast/playback-authorized;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-CSpot-Playback-Source $arg_src;
        proxy_set_header X-CSpot-Playback-URI $request_uri;
    }

    location = /camera/api/ws {
        auth_request /camera-playback-auth;
        proxy_pass __CAMERA_PROXY_UPSTREAM__api/ws;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade "websocket";
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location = /camera/api/stream.m3u8 {
        auth_request /camera-playback-auth;
        proxy_pass __CAMERA_PROXY_UPSTREAM__api/stream.m3u8;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location /camera/api/hls/ {
        auth_request /camera-playback-auth;
        proxy_pass __CAMERA_PROXY_UPSTREAM__api/hls/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # Only expose browser playback. In particular, never proxy go2rtc's
    # configuration or stream-inspection APIs, which include upstream URLs.
    location /camera/ {
        return 404;
    }

    location / {
        try_files $uri /index.html;
    }
}
