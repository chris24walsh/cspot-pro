services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile.prod
    env_file:
      - .env.church
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - cspot_pro_storage:/app/storage
      - ./recordings:/app/storage/recordings

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile.prod
      args:
        VITE_API_BASE_URL: /api
    depends_on:
      - api
    ports:
      - "80:80"
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    env_file:
      - .env.church
    restart: unless-stopped
    volumes:
      - cspot_pro_postgres:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/001-init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cspot -d cspot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cspot_pro_postgres:
  cspot_pro_storage:
